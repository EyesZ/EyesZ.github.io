baseURL = "https://eyesz.pt/"
languageCode = "en-us"
title = "Eyesz"
enableRobotsTXT = true
enableGitInfo = false

# Bio line shown under the header on the home page.
[params]
  description = "Human."
  author = "Eyesz"
  github = "Eyesz"
  linkedin = "joao-pino"
  email = "eyesz@tutamail.com"

[taxonomies]
  tag = "tags"

[outputs]
  home = ["html", "rss", "json"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

[menus]
  [[menus.main]]
    name = "writeups"
    pageRef = "/writeups"
    weight = 10
  [[menus.main]]
    name = "ideas"
    pageRef = "/posts"
    weight = 15
  [[menus.main]]
    name = "projects"
    pageRef = "/projects"
    weight = 20
# Screenshots are flat-colour terminal captures, so they downscale badly under
# the default Box filter and encode badly under the default "photo" hint.
[imaging]
  resampleFilter = "Lanczos"
  [imaging.webp]
    quality = 90
    hint = "text"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    # Otherwise a lone image becomes <p><figure>…</figure></p>, which the parser
    # splits into a stray empty paragraph.
    wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]
  [markup.goldmark.extensions.typographer]
    disable = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 4
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[minify]
  [minify.tdewolff.html]
    keepQuotes = true
